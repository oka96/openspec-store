schema: role-specs

context: |
  This illustrative specification store groups role-owned feature specs under
  REQ-xxx requirements and their existing lowercase OpenSpec change directories.
  Canonical IDs are SA-REQ-xxx-feature, FE-REQ-xxx-feature, BE-REQ-xxx-feature,
  and QA-REQ-xxx-feature; each role can have multiple specs. Metadata version 2
  registers each exact ID in openspec/requirements.json. Keep per-spec contracts
  at specs/<ID>/spec.md and tasks at tasks/<ID>.md inside the requirement change.
  Shared proposal/design provide context. Spec-scoped work preserves shared and
  sibling artifacts. Legacy originals are migration references, not active work.
  Checked sample tasks are seeded demonstration progress, not implementation or
  test evidence. This repository owns specifications only; the Kanban app lives
  separately in /Users/oka/Desktop/openhands-apps.
