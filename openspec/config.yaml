schema: sa
context: |
  This is a specifications-only store. Each role change owns proposal.md,
  design.md, specs/**/spec.md, tasks.md and scope.json. Folder prefixes SA, BE,
  FE and QA determine role and exact requirement identity. Use schemas sa,
  backend, frontend and qa respectively. SA can span repositories but never
  edits code; it hands off to backend and frontend. Those roles each bind one
  repository and reference SA. QA binds one regression repo and references SA,
  frontend and backend. The meeting-room demo uses the three sample repositories.
  Never treat unchecked tasks or planning artifacts as implementation evidence.
