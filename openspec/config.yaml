schema: spec-driven

context: |
  Main role specifications live in openspec/specs/ under sa/, fe/, be/ and qa/.
  They cover solution design, frontend, backend and verification.
  Each role feature is an independent change named
  <role>-<requirementPrefix>-<requirementId>-<feature>, for example
  FE-REQ-003-filters or BE-STORY-12-api. SA, FE, BE and QA identify ownership.
  The exact uppercase prefix and numeric ID group the requirement; preserve
  leading zeroes. Folder names are authoritative. No requirement registry is
  required. Each change owns proposal.md, design.md, specs/*/spec.md and tasks.md.
  Optional display context lives in the proposal's ## Kanban section. Preserve
  sibling changes and main specs when working on one role change.
  Checked sample tasks are illustrative progress, not implementation evidence.
  This repository owns specifications only; the Kanban app lives separately in
  /Users/oka/Desktop/openhands-apps.
