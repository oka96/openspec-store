name: role-specs
version: 1
description: Requirement planning with independently tracked role-owned feature specifications
artifacts:
  - id: proposal
    generates: proposal.md
    description: Shared requirement motivation and scope
    template: proposal.md
    instruction: |
      Describe why this requirement exists, its observable behavior, and its impact.
      Keep its existing lowercase OpenSpec change directory. The requirement ID is
      REQ-<at least three digits>. Identify role-owned capabilities using exact IDs
      SA-REQ-xxx-<feature>, FE-REQ-xxx-<feature>, BE-REQ-xxx-<feature>, and
      QA-REQ-xxx-<feature>. The feature is lowercase kebab case. Multiple features
      per role are supported; do not combine unrelated feature scopes for convenience.
      These uppercase canonical capability IDs intentionally override the default
      spec-driven kebab-case capability naming guidance.
      Existing shared proposal/design and sibling artifacts are read-only context
      during a spec-scoped Propose, Update, or Apply automation.
    requires: []
  - id: specs
    generates: "specs/*/spec.md"
    description: Separate behavior contracts for each named role feature
    template: spec.md
    instruction: |
      Write specs/<canonical ID>/spec.md for each registered role feature. Use the
      exact requirement ID and owner prefix: SA=SA, Frontend=FE, Backend=BE, QA=QA.
      Cover all four roles when preparing a complete requirement, allowing several
      specs under any role. A temporarily empty role is permitted but incomplete.
      Metadata version 2 in openspec/requirements.json registers each spec as
      {id,title,state,note}; the role contains {owner,note,specs}. State is backlog,
      in_progress, or blocked; completion comes from the spec's own task file.
      IDs are unique across the store, at most 160 characters, with at most 20
      specs per requirement. Specs express meaningful observable role contracts,
      SHALL/MUST requirements, and #### Scenario sections with WHEN/THEN outcomes.
      New role capabilities start with a Purpose of at least 50 characters and
      use ADDED Requirements; changes to archived capabilities use full MODIFIED
      requirement blocks. Read shared proposal/design and related role contracts.
      A spec-scoped automation creates or updates only its selected spec and task
      file. Preserve shared context, siblings, and legacy migration references.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Shared design and cross-role agreements
    template: design.md
    instruction: |
      Explain the shared design, boundaries, decisions, risks, and role contracts.
      Resolve decisions that affect implementation before writing tasks. Reference
      role spec IDs and describe integration points without merging their scopes.
      Preserve the shared design during spec-scoped automation; request a separate
      explicit requirement-wide revision if its contract must change.
    requires: [proposal]
  - id: tasks
    generates: "tasks/*.md"
    description: Independently verifiable task checklists for each role spec
    template: tasks.md
    instruction: |
      Create tasks/<canonical spec ID>.md for every registered role spec. Every
      checkbox must carry its exact owner tag: [SA], [Frontend], [Backend], or [QA].
      Use numbered - [ ] X.Y tasks with an explicit verification outcome. Numbers
      must be unique within a spec and can repeat across different specs. Keep at
      most 500 tasks across a requirement. A nonempty, fully checked task file
      completes its spec; every registered spec must be complete to finish a role,
      and every role must have a spec to finish the requirement. Missing files and
      empty checklists remain incomplete. Only x or X checkbox markers mean done.
      Preserve all sibling tasks; only check selected-spec work after its stated
      implementation and verification succeeds. Seeded sample checks are not
      evidence that the product was implemented or tested.
    requires: [specs, design]
apply:
  requires: [tasks]
  tracks: "tasks/*.md"
  instruction: |
    Read shared planning and selected role spec context. Select one explicit spec
    ID for scoped work and only complete its tasks after verification. Task identity
    is (spec ID, local task number); respect the returned sourcePath and line.
    Preserve sibling specs/tasks, shared proposal/design, metadata, and legacy
    references. Requirement progress aggregates every role spec, not one checklist.
